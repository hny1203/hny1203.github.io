const gD=(rates,f,c,p)=>[...new Set(rates.filter(r=>r.f===f&&r.c===c&&r.p===p).map(r=>r.d))];
const gR=(rates,f,c,p,d)=>{const x=rates.find(r=>r.f===f&&r.c===c&&r.p===p&&r.d===d);return x?x.r:null;};
// 교습과정(p) 목록 조회
const gP=(rates,f,c)=>[...new Set(rates.filter(r=>r.f===f&&r.c===c).map(r=>r.p))];

  return{id,tp:"추가",isNew:true,f:def?.f||"",c:def?.c||"",p:def?.allowedP?.length===1?def.allowedP[0]:"",d:"",nm:"",cap:"",mpd:"",dpw:"",wpm:"4.2",fee:""};
};

const calc=(row,rates)=>{
  const m=+row.mpd||0,d=+row.dpw||0,w=+row.wpm||0,fe=+row.fee||0;
  const wk=m*d,mo=Math.round(wk*w*10)/10;
  const pm=mo>0?fe/mo:0;
  const std=gR(rates,row.f,row.c,row.p,row.d);
  const ok=row.f&&row.c&&row.p&&row.d&&m>0&&d>0&&w>0&&fe>0;
  const st=ok&&std!==null?(pm<=std?"적정":"초과"):null;
  return{wk,mo,pm:Math.round(pm*100)/100,std,st,ok};
};

// 5분 단위 반올림 헬퍼
const snap5=(v)=>{const n=+v||0;if(n===0)return"0";const r=Math.round(n/5)*5;return String(Math.max(0,r));};

// ── 공용 컴포넌트 ──
const Sel=React.memo(function Sel({value,options,onChange,ph="선택",w,disabled:dis}){
  return(
    <select value={value} onChange={e=>onChange(e.target.value)} disabled={dis}
      style={{padding:"3px 2px",border:"1px solid #ccd",borderRadius:2,fontSize:11,
              background:dis?"#f0f0f0":"#fff",opacity:dis?.6:1,color:dis?"#555":"#222",
              ...(w?{width:w}:{})}}>
      <option value="" disabled>{ph}</option>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
});

const Inp=React.memo(function Inp({value,onChange,ph="",isNum=false,w,disabled:dis,bold,color:cl,bc,onBlur}){
  return(
    <input type="text" inputMode={isNum?"numeric":"text"}
      value={value||""}
      onChange={e=>{
        const v=isNum?e.target.value.replace(/[^0-9]/g,""):e.target.value;
        onChange(v);
      }}
      onBlur={onBlur}
      placeholder={ph} disabled={dis}
      style={{padding:"3px 4px",border:`1px solid ${bc||"#ccd"}`,borderRadius:2,
              fontSize:11,background:dis?"#f0f0f0":"#fff",opacity:dis?.6:1,
              fontWeight:bold?700:400,color:cl||"#222",...(w?{width:w}:{})}}/>
  );
});

// 5분 단위 입력 (+ / - 버튼)
const MpdInp=React.memo(function MpdInp({value,onChange,onWarn,disabled:dis}){
  const adjust=(delta)=>{
    if(dis)return;
    const cur=+value||0;
    const next=Math.max(0,cur+delta);
    onChange(String(next));
  };
  const handleBlur=()=>{
    if(!value)return;
    const n=+value;
    if(n%5!==0){
      const snapped=snap5(value);
      onChange(snapped);
      onWarn&&onWarn(`교습 분 수는 5분 단위로 설정 가능합니다. ${n}분 → ${snapped}분으로 조정되었습니다.`);
    }
  };
  return(
    <div style={{display:"inline-flex",alignItems:"center",gap:2}}>
      <button type="button" onClick={()=>adjust(-5)} disabled={dis}
        style={{width:16,height:18,padding:0,border:"1px solid #ccd",borderRadius:2,
          background:dis?"#f0f0f0":"#fff",cursor:dis?"default":"pointer",fontSize:10,
          color:"#666",lineHeight:1}}>−</button>
      <input type="text" inputMode="numeric"
        value={value||""}
        onChange={e=>onChange(e.target.value.replace(/[^0-9]/g,""))}
        onBlur={handleBlur}
        placeholder="분" disabled={dis}
        style={{padding:"3px 2px",border:"1px solid #ccd",borderRadius:2,fontSize:11,
          background:dis?"#f0f0f0":"#fff",opacity:dis?.6:1,width:32,textAlign:"center"}}/>
      <button type="button" onClick={()=>adjust(5)} disabled={dis}
        style={{width:16,height:18,padding:0,border:"1px solid #ccd",borderRadius:2,
          background:dis?"#f0f0f0":"#fff",cursor:dis?"default":"pointer",fontSize:10,
          color:"#666",lineHeight:1}}>+</button>
    </div>
  );
});

});

function App(){

  const [docTab,setDocTab]=useState(0);
  const [compareView,setCompareView]=useState("after");
  const [toast,setToast]=useState("");
  const [showCertModal,setShowCertModal]=useState(false);
  const [courseTypeLocked,setCourseTypeLocked]=useState(false);
  const sampleIdx=useRef({academy:0,tutoring:0});
  const docRef=useRef(null);

  const RATES=office?RATES_BY_OFFICE[office]||[]:[]; 
  const officeInfo=OFFICES.find(o=>o.id===office);
  const isTutoring=type==="tutoring";
  const maxCapPerClass=isTutoring?9:999;
  const maxTotalCap=(isTutoring&&info.maxCap)?+info.maxCap:999;

  const ct=COURSE_TYPES[courseType]||null;
  const liveRows=editRows.filter(r=>r.tp!=="삭제");
  const hasOver=liveRows.some(r=>calc(r,RATES).st==="초과");
  const allFilled=liveRows.length>0&&liveRows.every(r=>calc(r,RATES).ok);
  const dupNames=(()=>{
    const names=liveRows.filter(r=>r.nm).map(r=>r.nm.trim());
    const seen=new Set();const dups=new Set();
    names.forEach(n=>{if(seen.has(n))dups.add(n);seen.add(n);});
    return dups;
  })();
  const hasDup=dupNames.size>0;
  const totalLiveCap=liveRows.reduce((s,r)=>s+(+r.cap||0),0);
  const hasCapClassErr=isTutoring&&liveRows.some(r=>+r.cap>maxCapPerClass);
  const hasCapTotalErr=isTutoring&&totalLiveCap>maxTotalCap;
  const hasMpdErr=liveRows.some(r=>r.mpd&&+r.mpd%5!==0);
  const allOk=allFilled&&!hasOver&&!hasDup&&!hasCapClassErr&&!hasCapTotalErr&&!hasMpdErr;

  const updEdit=(id,k,v)=>setEditRows(prev=>prev.map(r=>{
    if(r.id!==id)return r;
    const u={...r,[k]:v};
    if(k==="p")return{...u,d:""};
    if(k==="cap"&&isTutoring){const n=Math.min(+v||0,maxCapPerClass);return{...u,cap:String(n)};}
    return u;
  }));
  const addEdit=()=>{
    const nid=Math.max(0,...editRows.map(r=>r.id))+1;
    setEditRows(p=>[...p,blankRow(nid,courseType)]);
  };
  const delEdit=(id)=>setEditRows(p=>p.length>1?p.filter(r=>r.id!==id):p);

  const loadSample=useCallback(()=>{
    if(!office)return;
    const isA=type==="academy";
    const samplesMap=isA?ACADEMY_SAMPLES:TUTORING_SAMPLES;
    const samples=samplesMap[office]||[];
    if(samples.length===0)return;
    const key=isA?"academy":"tutoring";
    const idx=sampleIdx.current[key]%samples.length;
    sampleIdx.current[key]=idx+1;
    const s=samples[idx];
    setInfo({...s.info});
    setCourseType(s.ct);
    setCourseTypeLocked(true); // 샘플 로드 시 교습과정 잠금 (등록된 교습과정 외 변경 불가)
    setExistingRows(s.existing.map(r=>({...r})));
    setEditRows(s.editRows.map(r=>({...r,isNew:r.isNew!==undefined?r.isNew:r.tp==="추가"})));
  },[type,office]);

  const canNext=()=>{
    if(step===0)return office&&type;
    if(step===1)return info.ownerName&&info.nm&&courseType;
    if(step===2)return!!mode;
    if(step===3)return allOk;
    if(step===4)return signed;
    return true;

  // ── PDF 다운로드 ──

            <Inp value={row.cap} onChange={v=>updEdit(row.id,"cap",v)} ph="0" isNum={true} w="42px" disabled={isDel} bc={isCapErr?"#c0392b":undefined} color={isCapErr?"#c0392b":undefined}/>
          </TD>
          <TD style={{background:isMpdErr?"#fdf0f0":"transparent"}}>
            <MpdInp value={row.mpd} onChange={v=>updEdit(row.id,"mpd",v)} onWarn={setToast} disabled={isDel}/>
          </TD>
          <TD><Inp value={row.dpw} onChange={v=>updEdit(row.id,"dpw",v)} ph="회" isNum={true} w="40px" disabled={isDel}/></TD>
          <TD>{isDel?"-":<select value={row.wpm} onChange={e=>updEdit(row.id,"wpm",e.target.value)} style={{padding:"2px",border:"1px solid #ccd",borderRadius:2,fontSize:11,width:48}}><option value="4.2">4.2</option><option value="4">4</option></select>}</TD>
          <TD style={{fontWeight:600,fontSize:11}}>{isDel?"-":rc.wk>0?fmt(rc.wk):"-"}</TD>
          <TD style={{fontWeight:600,fontSize:11}}>{isDel?"-":rc.mo>0?fmt(rc.mo):"-"}</TD>
          <TD style={{background:isDel?"#f9f9f9":isOver?"#fdf0f0":"#f0f4fa"}}>
            {isDel?"-":<Inp value={row.fee} onChange={v=>updEdit(row.id,"fee",v)} ph="0" isNum={true} w="82px" bold color={isOver?"#c0392b":"#1a4b8c"} bc={isOver?"#c0392b":"#1a4b8c"} disabled={isDel}/>}
          </TD>
          <TD style={{fontWeight:700,fontSize:11,color:isDel?"#aaa":isOver?"#c0392b":"#27ae60"}}>{isDel?"-":rc.pm>0?rc.pm.toFixed(2):"-"}</TD>
          <TD>{isDel?<span style={{color:"#aaa",fontSize:10}}>삭제</span>:rc.st?<span style={{display:"inline-block",padding:"1px 7px",borderRadius:8,fontSize:10,color:"#fff",background:isOver?"#c0392b":"#27ae60",fontWeight:700}}>{rc.st}</span>:"-"}</TD>
          <TD style={{borderLeft:"none",padding:"2px"}}>
            {!isExisting&&editRows.length>1&&<button onClick={()=>delEdit(row.id)} style={{background:"none",border:"1px solid #ddd",borderRadius:2,color:"#999",fontSize:10,cursor:"pointer",padding:"1px 5px"}}>✕</button>}
          </TD>
        </tr>
      );
    };

    const renderReadonlyRow=(row,i,strikethrough)=>{
      const rc=calc(row,RATES);
      return(<tr key={row.id} style={{background:i%2===0?"#fff":"#f8fafc",textDecoration:strikethrough?"line-through":"none",color:strikethrough?"#bbb":"#222"}}>
        <td style={S.rtd}>{row.f}</td><td style={S.rtd}>{row.c}</td><td style={S.rtd}>{row.p}</td><td style={S.rtd}>{row.d}</td>
        <td style={{...S.rtd,fontWeight:700,color:"#1a4b8c",background:"#eef3fa"}}>{rc.std||"-"}</td>
        <td style={S.rtd}>{row.nm}</td><td style={S.rtd}>{row.cap}</td><td style={S.rtd}>{row.mpd}</td><td style={S.rtd}>{row.dpw}</td><td style={S.rtd}>{row.wpm}</td>
        <td style={{...S.rtd,fontWeight:600}}>{rc.wk}</td><td style={{...S.rtd,fontWeight:600}}>{fmt(rc.mo)}</td>
        <td style={{...S.rtd,fontWeight:700}}>{fmt(+row.fee)}</td><td style={S.rtd}>{rc.pm.toFixed(2)}</td>
        <td style={S.rtd}>{strikethrough?<span style={{color:"#c0392b",fontSize:10}}>삭제</span>:<span style={{color:"#27ae60",fontSize:10}}>유지</span>}</td>
      </tr>);
    };

    const header=(showType,hasAction)=>(<tr>
      {showType&&<TH w="52px">구분</TH>}
      <TH>분야</TH><TH>계열</TH><TH>교습과정</TH><TH>교습대상</TH>
      <TH bg="#dce6f0">기준<br/>단가</TH><TH>교습<br/>과목명</TH>
      <TH w="44px">{isTutoring?"정원<br/>(max9)":"정원"}</TH>
      <TH w="68px">하루<br/>(5분단위)</TH><TH w="42px">주<br/>(회)</TH><TH w="50px">월<br/>주수</TH>
      <TH>주총<br/>시간①</TH><TH>월총<br/>시간②</TH>
      <TH bg="#dce6f0">희망<br/>교습비④</TH><TH>분당<br/>단가③</TH><TH>판정</TH>
      {hasAction&&<TH w="28px" bg="#eee"> </TH>}
    </tr>);

    return(<div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={S.cardTitle}>교습비 등 내역서</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={loadSample} style={S.sampleBtn}>📋 샘플 데이터 (랜덤)</button>
          <button onClick={addEdit} style={S.addBtn}>+ 교습과목 추가</button>
        </div>
      </div>

      {ct&&<div style={{background:"#e8eef7",borderRadius:6,padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:13,color:"#333"}}>📌 {type==="academy"?"학원":"교습소"} 등록 교습과정:</span>
        <span style={{fontWeight:700,fontSize:14,color:"#1a4b8c",background:"#fff",padding:"3px 12px",borderRadius:4,border:"1px solid #1a4b8c"}}>{courseType}</span>
        <span style={{fontSize:12,color:"#666"}}>분야: {ct.f} | 계열: {ct.c}</span>
      </div>}

      {isTutoring&&(
        <div style={{background:"#fff8e7",border:"1px solid #f0c040",borderRadius:6,padding:"10px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontWeight:700,fontSize:13,color:"#b45309"}}>⚠ 교습소 정원 제한</span>
          <span style={{fontSize:12,color:"#78350f"}}>반당 정원 최대 9명{info.maxCap?` · 일시수용가능인원 ${info.maxCap}명 (현재 합계: ${totalLiveCap}명)`:""}</span>
          {hasCapTotalErr&&<span style={{fontSize:12,color:"#c0392b",fontWeight:700}}>❌ 총 정원 초과!</span>}
        </div>
      )}

      <div style={{fontSize:11,color:"#666",margin:"0 0 8px",padding:"6px 12px",background:"#f6f8fb",borderRadius:4}}>
        💡 <strong>하루 교습 분 수</strong>는 5분 단위로 설정 가능합니다. ± 버튼 또는 직접 입력 후 5분 단위로 자동 조정됩니다.
      </div>

      <p style={{fontSize:12,color:"#666",margin:"0 0 8px"}}>
        {officeInfo?.name} | 조정기준액 {officeInfo?.date} 시행 | 변경구분: <strong>{mode}</strong>
      </p>

      {/* 기존 과목 목록 */}
      {existingRows.length>0&&(<div style={{marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,
          color:mode==="기존삭제"?"#c0392b":mode==="일부수정"?"#555":"#27ae60",
          margin:"8px 0 4px",display:"flex",alignItems:"center",gap:6}}>
          {mode==="기존삭제"?"🗑 기존 교습과정 (전체 삭제)":mode==="일부수정"?"📋 기존 교습과정 목록 (참고용)":"📌 유지되는 기존 교습과정"}
          <span style={{fontSize:11,fontWeight:400,color:"#888"}}>(수정 불가)</span>
        </div>
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>{header(false,false)}</thead>
          <tbody>{existingRows.map((r,i)=>renderReadonlyRow(r,i,mode==="기존삭제"))}</tbody>
        </table></div>
      </div>)}

      <div style={{fontSize:13,fontWeight:700,color:"#1a4b8c",margin:"8px 0 4px"}}>
        {isPartial?"📝 교습비 변경 내역 (삭제·변경·추가)":mode==="기존유지"?"➕ 신규 교습과정 추가":"📝 신규 등록 교습과정"}
      </div>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead>{header(isPartial,true)}</thead>
        <tbody>{editRows.map((r,i)=>renderEditableRow(r,i))}</tbody>
      </table></div>

      {hasOver&&<div style={S.errorBox}>⚠️ 기준단가 초과 항목이 {overCount}건 있습니다. 교습비를 조정해야 다음 단계로 진행할 수 있습니다.</div>}
      {hasCapClassErr&&<div style={S.errorBox}>⚠️ 교습소 반당 정원은 최대 9명입니다. 초과 항목이 있습니다.</div>}
      {hasCapTotalErr&&<div style={S.errorBox}>⚠️ 교습과목 전체 정원 합계({totalLiveCap}명)가 일시수용가능인원({maxTotalCap}명)을 초과합니다.</div>}
      {hasMpdErr&&<div style={S.errorBox}>⚠️ 하루 교습 분 수는 5분 단위로 입력해야 합니다.</div>}
      {hasDup&&<div style={{background:"#fef9e7",border:"1px solid #f0c040",borderRadius:6,padding:"14px 18px",color:"#e67e22",fontSize:14,fontWeight:600,marginTop:10}}>⚠️ 동일한 교습과목명이 있습니다: {[...dupNames].map(n=>`"${n}"`).join(", ")}. 교습과목명은 중복될 수 없습니다.</div>}
      {allOk&&<div style={S.successBox}>✅ 모든 교습과목의 분당단가가 기준 이내입니다. 다음 단계로 진행할 수 있습니다.</div>}
    </div>);
  };

  // ── STEP 4 ──
  const renderStep4=()=>{
    if(submitted)return(<div style={{...S.card,textAlign:"center",padding:48}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <div style={{fontSize:22,fontWeight:700,color:"#1a4b8c",marginBottom:8}}>교습비 변경 {type==="academy"?"등록신청":"신고"}이 완료되었습니다</div>
      <div style={{fontSize:14,color:"#666",marginBottom:8}}>접수번호: {office.toUpperCase()}-2026-{String(Math.floor(Math.random()*9000)+1000)}</div>
      <div style={{fontSize:13,color:"#888",marginBottom:24}}>수리 여부 결과를 휴대폰 문자로 안내해 드리겠습니다.</div>
      <button onClick={()=>setStep(5)} style={S.primaryBtn}>서류 출력하기 →</button>
    </div>);

    const delRows=editRows.filter(r=>r.tp==="삭제");
    const beforeRows=existingRows;
    const afterRows=liveRows;

    const miniTable=(rows,emptyMsg)=>rows.length===0?(<div style={{padding:"12px",color:"#888",fontSize:13,textAlign:"center"}}>{emptyMsg}</div>):(
      <table style={S.pvTable}><thead><tr style={{background:"#d4dde9"}}>
        <th style={S.th2}>교습과정</th><th style={S.th2}>교습과목</th><th style={S.th2}>대상</th><th style={S.th2}>정원</th>
        <th style={S.th2}>월총시간②</th><th style={S.th2}>분당단가③</th><th style={S.th2}>교습비④</th>
      </tr></thead><tbody>{rows.map(r=>{const rc=calc(r,RATES);return(
        <tr key={r.id}>
          <td style={S.td2}>{r.p}</td><td style={S.td2}>{r.nm}</td><td style={S.td2}>{r.d}</td><td style={S.td2}>{r.cap}명</td>
          <td style={S.td2}>{fmt(rc.mo)}분</td><td style={S.td2}>{rc.pm.toFixed(2)}원</td>
          <td style={{...S.td2,fontWeight:700}}>{fmt(+r.fee)}원</td>
        </tr>);})}</tbody></table>
    );

    return(<div style={S.card}>
      <div style={S.cardTitle}>신청 내용 확인 및 제출</div>

      <div style={{marginBottom:20}}>
        <div style={S.pvTitle}>{tpLabel} 교습비등 {type==="academy"?"변경등록 신청서":"변경신고서"}</div>
        <table style={S.pvTable}><tbody>
          <tr><td style={S.ptH}>{type==="academy"?"설립·운영자":"교습자"}</td><td style={S.ptD}>{info.ownerName}</td><td style={S.ptH}>생년월일</td><td style={S.ptD}>{info.birth}</td></tr>
          <tr><td style={S.ptH}>{tpLabel}명</td><td style={S.ptD}>{info.nm}</td><td style={S.ptH}>{type==="academy"?"등록번호":"신고번호"}</td><td style={S.ptD}>{info.reg}</td></tr>
          <tr><td style={S.ptH}>위치</td><td style={S.ptD} colSpan={3}>{info.loc}</td></tr>
          <tr><td style={S.ptH}>교육지원청</td><td style={S.ptD}>{officeInfo?.name}</td><td style={S.ptH}>변경구분</td><td style={S.ptD}>{mode}</td></tr>
        </tbody></table>
      </div>

      <div style={{marginBottom:20}}>
        <div style={S.pvTitle}>교습비 등 내역서 — 변경 전·후 비교</div>
        <div style={{display:"flex",gap:0,marginBottom:12,borderRadius:6,overflow:"hidden",border:"1px solid #1a4b8c",width:"fit-content"}}>
          {[["before","변경 전"],["after","변경 후"]].map(([v,label])=>(
            <button key={v} onClick={()=>setCompareView(v)}
              style={{padding:"8px 24px",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",
                      background:compareView===v?"#1a4b8c":"#fff",
                      color:compareView===v?"#fff":"#1a4b8c"}}>
              {label} {v==="before"?`(${beforeRows.length}개 과목)`:`(${afterRows.length}개 과목)`}
            </button>
          ))}
        </div>

        {compareView==="before"&&(<div>
          <div style={{fontSize:12,color:"#888",marginBottom:6}}>기존 등록된 교습과목 목록입니다.</div>
          {miniTable(beforeRows,"기존 등록된 교습과목이 없습니다.")}
        </div>)}
        {compareView==="after"&&(<div>
          <div style={{fontSize:12,color:"#888",marginBottom:6}}>이번 신청 후 최종 적용되는 교습과목 목록입니다.</div>
          {miniTable(afterRows,"신청할 교습과목이 없습니다.")}
          {mode==="일부수정"&&delRows.length>0&&(<div style={{marginTop:8}}>
            <div style={{fontSize:12,color:"#c0392b",fontWeight:600,marginBottom:4}}>삭제 처리될 과목:</div>
            {delRows.map(r=><span key={r.id} style={{display:"inline-block",margin:"2px 4px",padding:"2px 10px",background:"#fdecea",border:"1px solid #e8c0c0",borderRadius:4,fontSize:12,color:"#c0392b",textDecoration:"line-through"}}>{r.nm} ({r.d})</span>)}
          </div>)}
        </div>)}
      </div>

      <div style={{textAlign:"center",padding:"16px 0"}}>
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,cursor:"pointer",fontSize:15}}>
          <input type="checkbox" checked={signed} onChange={e=>setSigned(e.target.checked)} style={{width:20,height:20}}/>
          <span>위 내용이 사실과 다름없음을 확인하며, 전자서명합니다.</span>
        </label>
        <div style={{marginTop:6,fontSize:12,color:"#888"}}>신청인({type==="academy"?"학원설립·운영자":"교습자"}): {info.ownerName} (전자서명)</div>
        <div style={{marginTop:6,fontSize:12,color:"#888"}}>{officeInfo?.name} 교육장 귀하</div>
      </div>
      <div style={{textAlign:"center",marginTop:8}}>
        <button disabled={!signed} onClick={()=>setShowCertModal(true)} style={signed?S.submitBtn:S.submitBtnOff}>
          {signed?"🔐 인증서 서명 후 제출":"전자서명 후 제출 가능합니다"}
        </button>
      </div>
    </div>);
  };

  // ── STEP 5 ──
  const renderStep5=()=>{
    const tabs=[
      {label:type==="academy"?"변경등록 신청서":"변경신고서",getter:getNeshinchungContent,fname:type==="academy"?"변경등록신청서":"변경신고서"},
      {label:"교습비 내역서",getter:getNaeyokContent,fname:"교습비내역서"},
      {label:"교습비등 게시표",getter:getKesipyoContent,fname:"교습비등게시표"},
      {label:"반환기준",getter:getBanhwanContent,fname:"교습비반환기준"},
    ];
    const cur=tabs[docTab];
    return(<div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={S.cardTitle}>서류 출력 및 다운로드 (PDF)</div>
        <button onClick={()=>downloadPDF(cur.fname,cur.getter)} style={S.dlBtn}>📄 현재 서류 PDF 다운로드</button>
      </div>
      <p style={{fontSize:12,color:"#666",margin:"0 0 16px"}}>※ 모든 서류는 수정 불가능한 PDF 형식으로 다운로드됩니다. 탭을 전환하여 각 서류를 미리 확인하고 다운로드하세요.</p>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {tabs.map((t,i)=>(
          <button key={i} onClick={()=>downloadPDF(t.fname,t.getter)} 
            style={{padding:"6px 14px",border:"1px solid #1a4b8c",borderRadius:4,background:"#1a4b8c",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            📄 {t.label} PDF
          </button>
        ))}
      </div>
      <div style={{display:"flex",gap:0,borderBottom:"2px solid #1a4b8c",marginBottom:16,overflowX:"auto"}}>
        {tabs.map((t,i)=><button key={i} onClick={()=>setDocTab(i)} style={docTab===i?S.tabActive:S.tab}>{t.label}</button>)}
      </div>
      <div ref={docRef} style={S.doc} dangerouslySetInnerHTML={{__html:cur.getter()}}/>
    </div>);
  };

  const stepContent=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4,renderStep5];

  const handleCertConfirm=()=>{
    setShowCertModal(false);
    setSubmitted(true);
  };

  return(<div style={S.wrap}>
    <style>{`*{box-sizing:border-box;margin:0;padding:0}body{background:#eef1f6}
      select:focus,input:focus{outline:none;border-color:#1a4b8c;box-shadow:0 0 0 2px rgba(26,75,140,.15)}
      @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      ::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}`}</style>
    <div style={S.header}><div style={S.headerInner}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={S.logo}>NEIS</div>
        <div><div style={{fontSize:11,opacity:.7}}>나이스 대국민서비스</div><div style={{fontSize:16,fontWeight:700,letterSpacing:1}}>학원·교습소 교습비 온라인 변경 신청</div></div>
      </div>
      <div style={{fontSize:11,opacity:.6}}>프로토타입 시연 데모 v6.0</div>
    </div></div>
    <div style={S.stepBar}><div style={S.stepInner}>
      {STEPS.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:0}}>
        <div onClick={()=>{if(i<step){setStep(i);setSubmitted(false);}}} style={{display:"flex",alignItems:"center",gap:6,cursor:i<step?"pointer":"default"}}>
          <div style={i===step?S.scActive:i<step?S.scDone:S.sc}>{i<step?"✓":i+1}</div>
          <span style={{fontSize:12,color:i===step?"#1a4b8c":i<step?"#27ae60":"#999",fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
        </div>
        {i<STEPS.length-1&&<div style={{width:24,height:1,background:i<step?"#27ae60":"#ccc",margin:"0 4px"}}/>}
      </div>))}
    </div></div>
    <div style={S.content}><div style={{animation:"fadeIn .3s ease"}} key={step}>{stepContent[step]()}</div></div>
    {!(step===4&&submitted)&&(<div style={S.navBar}><div style={S.navInner}>
      {step>0&&step<5&&<button onClick={()=>{setStep(step-1);setSubmitted(false);}} style={S.backBtn}>← 이전</button>}
      <div style={{flex:1}}/>
      {step<5&&step!==4&&<button disabled={!canNext()} onClick={()=>setStep(step+1)} style={canNext()?S.primaryBtn:S.primaryBtnOff}>다음 →</button>}
      {step===5&&<button onClick={()=>{setStep(0);setSubmitted(false);setSigned(false);setEditRows([blankRow(1)]);setExistingRows([]);setInfo({});setCourseType("");setOffice("");setCourseTypeLocked(false);}} style={S.backBtn}>처음으로</button>}
    </div></div>)}
    <Toast msg={toast} onClose={()=>setToast("")}/>
    <CertModal open={showCertModal} signerName={info.ownerName||""}
      onConfirm={handleCertConfirm} onCancel={()=>setShowCertModal(false)}/>
  </div>);
}
